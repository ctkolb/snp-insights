[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snp-insights"
version = "0.1.0"
description = "Local-first, traceable genetic findings from a raw consumer DNA file."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema"]

[project.scripts]
snp-insights = "snp_insights.cli:main"

[tool.setuptools]
packages = ["snp_insights"]
