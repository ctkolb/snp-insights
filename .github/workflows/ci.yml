# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for every job; no job needs to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The project documents Python 3.9+; test the floor and a current one.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional schema dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Run test suite
        run: python tests/test_pipeline.py
      - name: Lint GitHub Actions workflows
        if: matrix.python == '3.12'
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint

  privacy-guard:
    name: privacy guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history so the guard can scan commit messages and the branch name.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run privacy guard (full)
        # Hashed owner terms come from a repository secret (newline-separated
        # sha256: entries). Unset is fine — the local list is primary and the
        # job must pass without it.
        env:
          SENSITIVE_TERMS: ${{ secrets.SENSITIVE_TERMS }}
        run: python scripts/guard.py --full

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # --redact keeps any matched value out of the log.
          /tmp/gitleaks detect --source . --redact --no-banner
